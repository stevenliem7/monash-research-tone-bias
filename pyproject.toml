[project]
name = "monash-research-code"
version = "0.1.0"
description = "Monash research tools for speech emotion recognition"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.11.0",
    "huggingface_hub>=0.26.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
wavlm = [
    "scikit-learn>=1.5.0",
    "soundfile>=0.12.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
]
